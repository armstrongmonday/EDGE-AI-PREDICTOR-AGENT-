name: desktop-windows
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install . pyinstaller pytest httpx
      - run: python -m pytest -q
      - run: python packaging/build_desktop.py
      - name: Smoke-test the packaged app
        shell: pwsh
        run: |
          $env:EDGEAGENT_NO_BROWSER = "1"; $env:EDGEAGENT_PORT = "8800"
          $p = Start-Process -FilePath dist/EdgeAgent/EdgeAgent.exe -PassThru -RedirectStandardOutput smoke.log -RedirectStandardError smoke.err
          Start-Sleep -Seconds 75
          $h = Invoke-RestMethod http://127.0.0.1:8800/health
          $a = Invoke-WebRequest http://127.0.0.1:8800/app/ -UseBasicParsing
          Stop-Process $p -Force
          if (-not $h.ok -or $a.StatusCode -ne 200) { Get-Content smoke.log, smoke.err; exit 1 }
      - run: Compress-Archive -Path dist/EdgeAgent -DestinationPath EdgeAgent-windows.zip
      - uses: actions/upload-artifact@v4
        with: { name: EdgeAgent-windows, path: EdgeAgent-windows.zip }
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with: { files: EdgeAgent-windows.zip }
